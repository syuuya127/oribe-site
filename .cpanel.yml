# cPanel「Git Version Control」から配置するための設定。
# 「Pull or Deploy」→「Deploy HEAD Commit」で下記が実行されます。
# ステージング(new.oribe-sushi.com.my)と本番(oribe-sushi.com.my)の両方に同じ内容を配置します。
# パスは cPanel の Domains 画面の Document Root に合わせること。
#
# 本番フォルダに Git 管理外の古いサイトが残っていた場合、初回のみ
# $HOME/oribe-site-backup-<日時> に丸ごと退避してから配置します(削除はしない)。
---
deployment:
  tasks:
    # ステージング
    - export STG=$HOME/new.oribe-sushi.com.my
    - /bin/mkdir -p $STG
    - /bin/cp -f *.html robots.txt sitemap.xml .htaccess $STG/
    - /bin/rm -rf $STG/css $STG/js $STG/images
    - /bin/cp -R css js images $STG/
    # 本番(初回は旧サイトを退避)
    - export PROD=$HOME/public_html/oribe-sushi.com.my
    - if [ -d "$PROD" ] && [ ! -e "$PROD/.deployed-from-git" ]; then /bin/mv "$PROD" "$HOME/oribe-site-backup-$(date +%Y%m%d-%H%M)"; fi
    - /bin/mkdir -p $PROD
    - /bin/cp -f *.html robots.txt sitemap.xml .htaccess $PROD/
    - /bin/rm -rf $PROD/css $PROD/js $PROD/images
    - /bin/cp -R css js images $PROD/
    - /bin/touch $PROD/.deployed-from-git
